<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favoright report</title>
  <link rel="stylesheet" href="report.css">
</head>
<body>

    <h1>Favoright report</h1>

  <main id="report"></main>

  <script type="module" src="report.js"></script>
</body>
</html>
